# One origin for the page and the API, so the refresh cookie works as in dev.
server {
   listen 80;
   root /usr/share/nginx/html;

   location /api/ {
      proxy_pass http://api:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
   }

   # Vite puts a hash in every asset name, so they can be cached for good.
   location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
   }

   # Every other path is a page of the app, so index.html answers it.
   location / {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
   }
}
